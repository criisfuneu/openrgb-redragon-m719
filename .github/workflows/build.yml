name: Compilação OpenRGB Redragon M719

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout do repositório pessoal (com os ficheiros M719)
      uses: actions/checkout@v4
      with:
        path: personal_repo

    - name: Clonar OpenRGB Oficial de forma limpa
      shell: pwsh
      env:
        GIT_TERMINAL_PROMPT: 0
      run: |
        git config --global credential.helper ""
        git clone --depth 1 https://github.com/OpenRGBOrg/OpenRGB.git openrgb_src

    - name: Injetar suporte do Redragon M719
      shell: pwsh
      run: |
        if (Test-Path "personal_repo\include\m719") {
          New-Item -ItemType Directory -Force -Path "openrgb_src\include\m719"
          Copy-Item -Recurse -Force "personal_repo\include\m719\*" "openrgb_src\include\m719\"
        }

    - name: Configurar ambiente MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configurar Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Compilar OpenRGB
      working-directory: openrgb_src
      run: |
        qmake OpenRGB.pro
        nmake release

    - name: Guardar Executável (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: OpenRGB-Redragon-M719-Windows
        path: openrgb_src/release/OpenRGB.exe
