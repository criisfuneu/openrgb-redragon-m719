name: Compilação OpenRGB Redragon M719 (Qt6)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout do repositório pessoal (com os ficheiros M719)
      uses: actions/checkout@v4
      with:
        path: personal_repo

    - name: Clonar OpenRGB Oficial (GitLab)
      shell: pwsh
      run: |
        git clone --depth 1 https://gitlab.com/CalcProgrammer1/OpenRGB.git openrgb_src

    - name: Injetar suporte do Redragon M719 na pasta correta de Controladores
      shell: pwsh
      run: |
        # Criar a pasta de destino correta dentro de Controllers do OpenRGB
        $targetDir = "openrgb_src\Controllers\RedragonM719Controller"
        New-Item -ItemType Directory -Force -Path $targetDir

        # Copiar os ficheiros do M719 do repositório pessoal para o local correto de compilação
        if (Test-Path "personal_repo\include\m719") {
          Copy-Item -Recurse -Force "personal_repo\include\m719\*" "$targetDir\"
        } elseif (Test-Path "personal_repo\Controllers\RedragonM719Controller") {
          Copy-Item -Recurse -Force "personal_repo\Controllers\RedragonM719Controller\*" "$targetDir\"
        }

        # Adicionar o novo controlador ao ficheiro OpenRGB.pro para que o qmake o compile
        Add-Content -Path "openrgb_src\OpenRGB.pro" -Value "INCLUDEPATH += Controllers/RedragonM719Controller"
        Add-Content -Path "openrgb_src\OpenRGB.pro" -Value "HEADERS += Controllers/RedragonM719Controller/*.h"
        Add-Content -Path "openrgb_src\OpenRGB.pro" -Value "SOURCES += Controllers/RedragonM719Controller/*.cpp"

    - name: Configurar ambiente MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configurar Qt (Qt6)
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Compilar OpenRGB com Qt6
      working-directory: openrgb_src
      shell: pwsh
      run: |
        qmake OpenRGB.pro
        nmake release

    - name: Preparar e Empacotar Dependências (Qt6 e libusb)
      shell: pwsh
      run: |
        mkdir dist
        Copy-Item "openrgb_src\release\OpenRGB.exe" "dist\"
        windeployqt --qmldir openrgb_src "dist\OpenRGB.exe"
        Invoke-WebRequest -Uri "https://github.com/openrgb-org/OpenRGB-Dependency-Binaries/raw/master/libusb-1.0.dll" -OutFile "dist\libusb-1.0.dll" -ErrorAction SilentlyContinue

    - name: Guardar Executável Completo (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: OpenRGB-Redragon-M719-Qt6-Windows
        path: dist/
