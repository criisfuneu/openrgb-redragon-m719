name: Compilazione OpenRGB Redragon M719

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout del repository personale (con i file M719)
      uses: actions/checkout@v4

    - name: Clonare il codice sorgente ufficiale di OpenRGB
      run: |
        git clone --recursive https://github.com/OpenRGBOrg/OpenRGB.git openrgb_src
        xcopy /s /e /y include\m719 openrgb_src\include\m719\

    - name: Configurare ambiente MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configurare Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Compilare OpenRGB
      working-directory: openrgb_src
      run: |
        qmake OpenRGB.pro
        nmake release

    - name: Guardar Executável (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: OpenRGB-Redragon-M719-Windows
        path: openrgb_src/release/OpenRGB.exe
