name: Compilação OpenRGB Redragon M719

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout do repositório pessoal (com os ficheiros M719)
      uses: actions/checkout@v4
      with:
        path: personal_repo

    - name: Baixar código oficial do OpenRGB via API do GitHub
      shell: pwsh
      run: |
        $apiUrl = "https://api.github.com/repos/OpenRGBOrg/OpenRGB/tarball"
        $headers = @{ "User-Agent" = "GitHub-Actions-Script"; "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}" }
        Invoke-WebRequest -Uri $apiUrl -Headers $headers -OutFile "openrgb.tar.gz"
        
        # Extrair o tar.gz (o PowerShell no Windows 10/11 moderno suporta tar nativamente)
        mkdir openrgb_src
        tar -xzf openrgb.tar.gz -C openrgb_src --strip-components=1

    - name: Injetar suporte do Redragon M719
      shell: pwsh
      run: |
        if (Test-Path "personal_repo\include\m719") {
          New-Item -ItemType Directory -Force -Path "openrgb_src\include\m719"
          Copy-Item -Recurse -Force "personal_repo\include\m719\*" "openrgb_src\include\m719\"
        }

    - name: Configurar ambiente MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configurar Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Compilar OpenRGB
      working-directory: openrgb_src
      run: |
        qmake OpenRGB.pro
        nmake release

    - name: Guardar Executável (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: OpenRGB-Redragon-M719-Windows
        path: openrgb_src/release/OpenRGB.exe
