name: Compilação OpenRGB Redragon M719

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout do OpenRGB Principal
      uses: actions/checkout@v4
      with:
        repository: 'OpenRGBOrg/OpenRGB'
        submodules: recursive

    - name: Configurar ambiente MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configurar Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Compilar OpenRGB
      run: |
        qmake OpenRGB.pro
        nmake release

    - name: Guardar Executável (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: OpenRGB-Redragon-M719-Windows
        path: release/OpenRGB.exe
