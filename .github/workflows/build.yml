name: Compilazione Automatica OpenRGB Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout del repository
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Configurazione ambiente Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Configurazione ambiente MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compilazione con qmake e nmake
      run: |
        qmake OpenRGB.pro
        nmake release

    - name: Caricamento del file compilato (Artifact)
      uses: actions/upload-artifact@v3
      with:
        name: OpenRGB-Redragon-M719-Windows
        path: |
          release/OpenRGB.exe
