name: Compilação OpenRGB Redragon M719 (Qt6)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout do repositório pessoal (com os ficheiros M719)
      uses: actions/checkout@v4
      with:
        path: personal_repo

    - name: Clonar OpenRGB Oficial (GitLab)
      shell: pwsh
      run: |
        git clone --depth 1 https://gitlab.com/CalcProgrammer1/OpenRGB.git openrgb_src

    - name: Injetar suporte do Redragon M719 corretamente
      shell: pwsh
      run: |
        $targetDir = "openrgb_src\Controllers\RedragonM719Controller"
        New-Item -ItemType Directory -Force -Path $targetDir
        Copy-Item -Recurse -Force "personal_repo\include\m719\*" "$targetDir\"

        # Adicionar o path e os arquivos no OpenRGB.pro de forma segura
        $proPath = "openrgb_src\OpenRGB.pro"
        Add-Content -Path $proPath -Value ""
        Add-Content -Path $proPath -Value "# Redragon M719 Custom Controller"
        Add-Content -Path $proPath -Value "INCLUDEPATH += Controllers/RedragonM719Controller"
        
        $headers = Get-ChildItem -Path $targetDir -Filter "*.h"
        foreach ($h in $headers) {
            Add-Content -Path $proPath -Value "HEADERS += Controllers/RedragonM719Controller/$($h.Name)"
        }

        $sources = Get-ChildItem -Path $targetDir -Filter "*.cpp"
        foreach ($s in $sources) {
            Add-Content -Path $proPath -Value "SOURCES += Controllers/RedragonM719Controller/$($s.Name)"
        }
    - name: Configurar ambiente MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configurar Qt (Atualizado para Qt 6.6.3 para evitar erro do stdext)
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.3'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Compilar OpenRGB com Qt6
      working-directory: openrgb_src
      shell: pwsh
      run: |
        qmake OpenRGB.pro
        nmake -f Makefile.Release

    - name: Preparar e Empacotar Dependências (Qt6 e libusb)
      shell: pwsh
      run: |
        mkdir dist
        Copy-Item "openrgb_src\release\OpenRGB.exe" "dist\"
        windeployqt --qmldir openrgb_src "dist\OpenRGB.exe"

        # Procurar e copiar a libusb-1.0.dll diretamente dos binários do OpenRGB clonado, se existir
        $foundLibusb = Get-ChildItem -Path "openrgb_src" -Recurse -Filter "libusb-1.0.dll" | Select-Object -First 1
        if ($foundLibusb) {
            Copy-Item $foundLibusb.FullName "dist\"
            Write-Host "libusb-1.0.dll encontrada e copiada com sucesso!"
        } else {
            # Fallback: descarregar de um link direto raw e válido
            $dllUrl = "https://raw.githubusercontent.com/OpenRGBOrg/OpenRGB-Dependency-Binaries/master/Windows/x64/libusb-1.0.dll"
            Invoke-WebRequest -Uri $dllUrl -OutFile "dist\libusb-1.0.dll"
        }

    - name: Guardar Executável Completo (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: OpenRGB-Redragon-M719-Qt6-Windows
        path: dist/
