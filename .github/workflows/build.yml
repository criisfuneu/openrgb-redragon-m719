name: Compilação OpenRGB Redragon M719

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout do repositório pessoal
      uses: actions/checkout@v4

    - name: Clonar o código oficial do OpenRGB
      run: |
        git clone --depth 1 https://github.com/OpenRGBOrg/OpenRGB.git openrgb_src
        if exist include\m719 (
          xcopy /s /e /y include\m719 openrgb_src\include\m719\
        )

    - name: Configurar ambiente MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configurar Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Compilar OpenRGB
      working-directory: openrgb_src
      run: |
        qmake OpenRGB.pro
        nmake release

    - name: Guardar Executável (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: OpenRGB-Redragon-M719-Windows
        path: openrgb_src/release/OpenRGB.exe
